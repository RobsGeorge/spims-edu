name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: spims-staging-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
          LOOPBACK_HEALTH_HOST: ${{ secrets.STAGING_DOMAIN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 120s
          command_timeout: 30m
          envs: HEALTH_URL,LOOPBACK_HEALTH_HOST
          script: |
            set -euo pipefail
            APP_DIR="${STAGING_APP_DIR:-/var/www/spims-staging}"
            cd "$APP_DIR"
            test "$(pwd)" = "$APP_DIR"
            grep -q "DB_DATABASE=spims_staging" .env
            grep -q "APP_ENV=staging" .env

            PHP_BIN=php8.2
            DEPLOY_USER="$(whoami)"
            sudo -n chown -R "${DEPLOY_USER}:www-data" storage bootstrap/cache

            git fetch --prune origin
            git reset --hard origin/staging

            export PHP_BIN HEALTH_URL="${HEALTH_URL:-}" LOOPBACK_HEALTH_HOST="${LOOPBACK_HEALTH_HOST:-}"
            export QUEUE_UNIT=spims-queue-staging
            SKIP_GIT=1 ./scripts/vps-sync.sh
            ./scripts/vps-release.sh
