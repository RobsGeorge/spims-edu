name: Deploy to Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: spims-staging-deploy
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/spims-staging
            test "$(pwd)" = "/var/www/spims-staging"
            grep -q "DB_DATABASE=spims_staging" .env
            grep -q "APP_ENV=staging" .env

            PHP_BIN=php8.2
            DEPLOY_USER="$(whoami)"
            fix_runtime_permissions() {
              sudo -n chown -R "${DEPLOY_USER}:www-data" storage bootstrap/cache
              sudo -n find storage bootstrap/cache -type d -exec chmod 2775 {} +
              sudo -n find storage bootstrap/cache -type f -exec chmod 664 {} +
            }

            sudo -n chown -R "${DEPLOY_USER}:www-data" storage bootstrap/cache
            fix_runtime_permissions
            git fetch origin staging
            git reset --hard origin/staging
            COMPOSER_ALLOW_SUPERUSER=1 $PHP_BIN /usr/local/bin/composer install --no-interaction --prefer-dist --no-progress --no-scripts
            $PHP_BIN artisan down --retry=60 || true
            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan optimize:clear
            fix_runtime_permissions
            sudo -n systemctl reload php8.2-fpm
            $PHP_BIN artisan up || true
