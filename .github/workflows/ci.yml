name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    name: Lint pipelines and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deploy and CI artifacts
        run: bash scripts/verify-pipelines.sh

  sqlite-suite:
    name: Full test suite (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, curl, json, bcmath, gd, sqlite3, pdo_sqlite, pgsql, pdo_pgsql
          coverage: none
          tools: composer

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHPUnit (all suites, SQLite)
        run: php artisan test --compact --log-junit storage/logs/junit-sqlite.xml

      - name: Upload SQLite JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-sqlite
          path: storage/logs/junit-sqlite.xml
          if-no-files-found: ignore

  pgsql-migrate-fresh:
    name: PostgreSQL migrate:fresh --seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spims_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, curl, json, bcmath, gd, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application (PostgreSQL)
        run: |
          cp .env.example .env
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=spims_ci"
            echo "DB_USERNAME=postgres"
            echo "DB_PASSWORD=postgres"
          } >> .env
          php artisan key:generate

      - name: migrate:fresh --seed on clean PostgreSQL
        run: php artisan migrate:fresh --seed --force --no-interaction

  pgsql-full-suite:
    name: Full test suite on PostgreSQL (blocks deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Forced as real job-level env vars (not just appended to .env): PHPUnit applies
    # phpunit.xml's <env name="DB_CONNECTION" value="sqlite"/> (force=false) before
    # Laravel's dotenv bootstraps, and dotenv never overwrites an already-set env var.
    # Appending DB_* to .env alone (as pgsql-migrate-fresh does) is silently ignored by
    # `php artisan test` — verified locally: it kept running against SQLite. Setting
    # these here, so they exist in the process environment before PHP starts, is what
    # actually makes PHPUnit skip its sqlite default and use PostgreSQL.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: spims_ci
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spims_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, curl, json, bcmath, gd, pdo_pgsql
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application (PostgreSQL)
        run: |
          cp .env.example .env
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=spims_ci"
            echo "DB_USERNAME=postgres"
            echo "DB_PASSWORD=postgres"
          } >> .env
          php artisan key:generate

      - name: migrate:fresh --seed on clean PostgreSQL
        run: php artisan migrate:fresh --seed --force --no-interaction

      - name: PHPUnit (all suites, PostgreSQL 16)
        run: php artisan test --compact --log-junit storage/logs/junit-pgsql.xml

      - name: Upload PostgreSQL JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-pgsql
          path: storage/logs/junit-pgsql.xml
          if-no-files-found: ignore
