# SPIMS Nginx site.
# Copy to /etc/nginx/sites-available/<domain> and replace the __PLACEHOLDERS__.
# first-boot.sh does that substitution. Certbot will add the TLS server block.
#
# __SERVER_NAME__  e.g. spims-edu.com www.spims-edu.com
# __ROOT__         e.g. /var/www/spims/public

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    root __ROOT__;
    index index.php;
    client_max_body_size 64M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Request-Id $request_id always;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root __ROOT__;
    }

    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    # Same Laravel front controller as the website. Mobile /api/v1 lives here.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }
}
