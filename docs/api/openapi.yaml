              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found (unknown or another student's credential)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
