  /me/credentials:
    get:
      operationId: meCredentials
      summary: Non-revoked credentials issued to the authenticated student.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        serial:
                          type: string
                        language:
                          type: string
                        offering_id:
                          type: string
                          nullable: true
                        program_id:
                          type: string
                          nullable: true
                        issued_at:
                          type: string
                          format: date-time
                          nullable: true
                        verify_url:
                          type: string
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /credentials/{credential}/download:
    get:
      operationId: downloadCredential
      summary: Stream the credential file (PDF, or HTML fallback). Existence is private — another student's id returns 404.
